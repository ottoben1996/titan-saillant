name: Publier l'application

# La racine du dépôt porte la source ; la page publiée vient de `dist/`.
# Avant, le build écrasait `index.html` à la racine : la source était perdue à
# chaque mise en ligne et le build suivant ne savait plus quoi compiler.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rien ne part en ligne sans les tests : une régression de calcul de charge
      # se verrait en salle, pas dans un rapport de build.
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
